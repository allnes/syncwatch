name: Build patched Windows libwebrtc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout SyncWatch
        uses: actions/checkout@v5
        with:
          path: syncwatch

      - name: Checkout libwebrtc SDK
        uses: actions/checkout@v5
        with:
          repository: webrtc-sdk/libwebrtc
          ref: main
          submodules: true
          path: libwebrtc-sdk

      - name: Inject SyncWatch patch into libwebrtc build
        shell: pwsh
        run: |
          $buildScript = ".\libwebrtc-sdk\build\libwebrtc_win_build.cmd"
          $text = Get-Content $buildScript -Raw
          $needle = 'call git apply "libwebrtc\patches\allow_176k4_192k_shared_mode_formats.patch" -v --ignore-space-change --ignore-whitespace --whitespace=nowarn'
          $injected = $needle + [Environment]::NewLine + 'powershell -NoProfile -ExecutionPolicy Bypass -File "%COMMAND_DIR%..\syncwatch_patch_wmf.ps1"'
          if (-not $text.Contains($needle)) { throw "Could not locate upstream patch stage." }
          $text = $text.Replace($needle, $injected)
          Set-Content $buildScript $text -Encoding ascii
          Copy-Item .\syncwatch\tools\webrtc\syncwatch_patch_wmf.ps1 .\libwebrtc-sdk\syncwatch_patch_wmf.ps1

      - name: Install Ninja
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip" -OutFile ninja.zip
          Expand-Archive -Path ninja.zip -DestinationPath "${{ github.workspace }}\ninja"
          "${{ github.workspace }}\ninja" | Out-File -Append -Encoding utf8 -FilePath $Env:GITHUB_PATH

      - name: Configure Windows target
        shell: bash
        working-directory: libwebrtc-sdk/build
        run: echo -e '\ntarget_os = ["win"]' >> .gclient

      - name: Build patched Windows x64 release
        shell: cmd
        working-directory: libwebrtc-sdk/build
        run: libwebrtc_win_build.cmd --arch x64 --profile release

      - name: Verify patched source and binary
        shell: pwsh
        run: |
          $compiledSource = ".\libwebrtc-sdk\build\src\libwebrtc\src\win\wmf_h265_encoder.cc"
          if (!(Test-Path $compiledSource)) { throw "Compiled WMF source not found." }
          if (!(Select-String -Path $compiledSource -SimpleMatch "SYNCWATCH_WMF_FALLBACK" -Quiet)) {
            throw "SyncWatch WMF patch is absent from the source tree that was compiled."
          }
          $dll = ".\libwebrtc-sdk\build\libwebrtc-x64-release\lib\libwebrtc.dll"
          if (!(Test-Path $dll)) { throw "Built libwebrtc.dll not found." }
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (!$ascii.Contains("SYNCWATCH_WMF_FALLBACK")) {
            throw "Built DLL does not contain SyncWatch WMF fallback marker."
          }
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash
          "SYNCWATCH_WMF_FALLBACK=1" | Set-Content ".\libwebrtc-sdk\build\libwebrtc-x64-release\SYNCWATCH_PATCH.txt"
          "SHA256=$hash" | Add-Content ".\libwebrtc-sdk\build\libwebrtc-x64-release\SYNCWATCH_PATCH.txt"
          Write-Host "Verified patched DLL SHA256=$hash"

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path .\libwebrtc-sdk\build\libwebrtc-x64-release -DestinationPath .\libwebrtc-win-x64-release-patched.zip

      - name: Upload patched libwebrtc
        uses: actions/upload-artifact@v4
        with:
          name: libwebrtc-win-x64-release-patched
          path: libwebrtc-win-x64-release-patched.zip
          retention-days: 14
