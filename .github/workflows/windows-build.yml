name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate desktop host files
        shell: pwsh
        run: |
          if (-not (Test-Path "windows\CMakeLists.txt")) {
            flutter create --platforms=windows --project-name syncwatch --org dev.syncwatch --no-pub .
          }

      - name: Remove generated template test
        shell: pwsh
        run: |
          if (Test-Path "test\widget_test.dart") {
            Remove-Item "test\widget_test.dart" -Force
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare isolated WebRTC lifetime fix
        shell: pwsh
        run: |
          .\scripts\prepare_webrtc_plugin.ps1
          flutter pub get

      - name: Configure SyncWatch Windows multi-view runner
        shell: pwsh
        run: .\scripts\enable_multiview_windows.ps1

      - name: Analyze
        run: flutter analyze lib

      - name: Build Windows debug
        run: flutter build windows --debug

      - name: Check native remote media ownership and concurrency
        shell: pwsh
        run: |
          $nativeBuild = Join-Path $env:RUNNER_TEMP 'syncwatch-remote-media-check'
          $webrtcInclude = Join-Path $pwd '.dart_tool/syncwatch_plugins/flutter_webrtc/third_party/libwebrtc/include'
          cmake -S tools/webrtc -B $nativeBuild "-DWEBRTC_INCLUDE_DIR=$webrtcInclude"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $nativeBuild --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $nativeBuild -C Release --output-on-failure

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "build\\windows\\x64\\runner\\Debug\\syncwatch.exe")) {
            throw "syncwatch.exe was not produced"
          }
