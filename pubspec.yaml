name: syncwatch
description: Synchronized local movie watching with integrated voice and video calls.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.0.3
  http: ^1.6.0
  livekit_client: ^2.13.0
  shared_preferences: ^2.5.3
  window_manager: ^0.5.2
  win32: ^6.4.0
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  media_kit: ^1.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
